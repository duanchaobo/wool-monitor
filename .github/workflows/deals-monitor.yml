# GitHub Actions Workflow - AutoDL 远程采集优惠信息
# 每2小时：检查实例状态 → (关机则无卡开机) → SSH跑脚本 → (本次开机的才关机)
# 解决 GitHub 服务器在海外无法调用京东 API 的问题

name: 优惠信息巡检（AutoDL远程）

on:
  schedule:
    # 8:00-22:00 每2小时运行一次（0-8点不执行）
    - cron: '0 8,10,12,14,16,18,20,22 * * *'

  # 支持手动触发（方便测试）
  workflow_dispatch:

jobs:
  collect-via-autodl:
    name: AutoDL远程采集
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      need_power_off: ${{ steps.check_status.outputs.need_power_off }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      # ========== Step 1: 检查实例状态 ==========
      - name: 检查实例状态
        id: check_status
        run: |
          python3 << 'PYEOF'
          import requests
          import json
          import os
          import sys

          SESSION_TOKEN = "${{ secrets.AUTODL_SESSION_TOKEN }}"
          INSTANCE_UUID = "${{ secrets.AUTODL_INSTANCE_UUID }}"

          if not SESSION_TOKEN or not INSTANCE_UUID:
              print("❌ 缺少 AUTODL_SESSION_TOKEN 或 AUTODL_INSTANCE_UUID")
              sys.exit(1)

          headers = {
              "Authorization": SESSION_TOKEN,
              "Content-Type": "application/json;charset=UTF-8",
              "User-Agent": "Mozilla/5.0 (GitHub-Actions)"
          }

          # 查询实例列表
          print("📋 查询实例状态...")
          resp = requests.post(
              "https://www.autodl.com/api/v1/instance",
              json={"page_index":1,"page_size":50,"status":[],"charge_type":[],"sub_name":"","unbind_sub_user":False},
              headers=headers, timeout=30
          )
          result = resp.json()

          if result.get("code") != "Success":
              if "AuthorizeFailed" in str(result):
                  print("❌ Session Token 已过期！请运行 update_autodl_token.py 更新")
                  sys.exit(1)
              print(f"⚠️ 查询失败: {result.get('msg', 'unknown')}")
              sys.exit(1)

          # 找到目标实例
          instances = result.get("data", {}).get("list", [])
          target = None
          for inst in instances:
              if inst.get("uuid") == INSTANCE_UUID:
                  target = inst
                  break

          if not target:
              print(f"❌ 未找到实例 {INSTANCE_UUID}")
              sys.exit(1)

          status = target.get("status", "")
          print(f"实例状态: {status}")

          # 判断是否需要开机
          if status == "running":
              print("✅ 实例已在运行，无需开机")
              need_power_off = "false"
          else:
              print(f"实例状态为 {status}，需要开机")
              need_power_off = "true"

          # 输出到 GitHub Actions
          github_output = os.environ.get("GITHUB_OUTPUT", "")
          if github_output:
              with open(github_output, "a") as f:
                  f.write(f"need_power_off={need_power_off}\n")

          print(f"need_power_off={need_power_off}")
          PYEOF

      # ========== Step 2: 开机（仅当实例未运行） ==========
      - name: 无卡模式开机
        if: steps.check_status.outputs.need_power_off == 'true'
        run: |
          python3 << 'PYEOF'
          import requests
          import json
          import sys

          SESSION_TOKEN = "${{ secrets.AUTODL_SESSION_TOKEN }}"
          INSTANCE_UUID = "${{ secrets.AUTODL_INSTANCE_UUID }}"

          headers = {
              "Authorization": SESSION_TOKEN,
              "Content-Type": "application/json;charset=UTF-8",
              "User-Agent": "Mozilla/5.0 (GitHub-Actions)"
          }

          print("🔌 发送开机指令（无卡模式）...")
          resp = requests.post(
              "https://www.autodl.com/api/v1/instance/power_on",
              json={"instance_uuid": INSTANCE_UUID, "payload": "non_gpu"},
              headers=headers, timeout=30
          )
          result = resp.json()
          print(f"开机响应: {json.dumps(result, ensure_ascii=False)}")

          if result.get("code") == "Success":
              print("✅ 开机指令已发送")
          else:
              msg = str(result)
              if "running" in msg.lower() or "已" in msg:
                  print("实例已在运行中，继续执行")
              else:
                  print(f"⚠️ 开机异常: {result.get('msg', 'unknown')}")
                  sys.exit(1)
          PYEOF

      # ========== Step 3: 等待启动（仅当本次开机） ==========
      - name: 等待实例启动
        if: steps.check_status.outputs.need_power_off == 'true'
        run: |
          echo "⏳ 等待实例启动（约20秒）..."
          sleep 20
          echo "✅ 等待完成"

      # ========== Step 4: SSH 执行采集脚本 ==========
      - name: SSH 到 AutoDL 执行采集
        id: ssh_run
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AUTODL_SSH_HOST }}
          port: ${{ secrets.AUTODL_SSH_PORT }}
          username: ${{ secrets.AUTODL_SSH_USER }}
          key: ${{ secrets.AUTODL_SSH_KEY }}
          timeout: 60s
          command_timeout: 300s
          script: |
            echo "===== 开始执行优惠信息采集 ====="
            cd /root

            # 安装 python3 和 pip（如未安装）
            if ! command -v python3 &>/dev/null; then
              apt-get update -qq && apt-get install -y -qq python3 python3-pip
            fi
            if ! command -v pip3 &>/dev/null; then
              python3 -m ensurepip --upgrade 2>/dev/null || apt-get install -y -qq python3-pip
            fi

            # 开启学术加速（解决 GitHub 访问超时）
            source /etc/network_turbo 2>/dev/null || true

            # 检查项目是否已存在
            if [ -d "wool-monitor/.git" ]; then
              echo "📁 项目已存在，拉取最新代码"
              cd wool-monitor
              git pull --rebase origin main
            else
              echo "📥 克隆项目..."
              rm -rf wool-monitor
              git clone --depth 1 https://github.com/duanchaobo/wool-monitor.git
              cd wool-monitor
            fi

            # 安装依赖
            pip3 install -r requirements.txt -q

            # 配置环境变量
            cat > .env << ENVEOF
            WECHAT_WEBHOOK_URL=${{ secrets.WECHAT_WEBHOOK_URL }}
            JD_APP_KEY=${{ secrets.JD_APP_KEY }}
            JD_APP_SECRET=${{ secrets.JD_APP_SECRET }}
            JD_PID=${{ secrets.JD_PID }}
            TB_APP_KEY=${{ secrets.TB_APP_KEY }}
            TB_APP_SECRET=${{ secrets.TB_APP_SECRET }}
            TB_ADZONE_ID=${{ secrets.TB_ADZONE_ID }}
            SILICONFLOW_API_KEY=${{ secrets.SILICONFLOW_API_KEY }}
            ENVEOF

            # 执行采集
            python3 main.py
            echo "===== 采集执行完毕 ====="

  # ========== Step 5: 关机（仅当本次开机） ==========
  power-off:
    name: 关机
    needs: collect-via-autodl
    if: needs.collect-via-autodl.outputs.need_power_off == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: 调用 AutoDL API 关机
        run: |
          python3 << 'PYEOF'
          import requests
          import json

          SESSION_TOKEN = "${{ secrets.AUTODL_SESSION_TOKEN }}"
          INSTANCE_UUID = "${{ secrets.AUTODL_INSTANCE_UUID }}"

          headers = {
              "Authorization": SESSION_TOKEN,
              "Content-Type": "application/json;charset=UTF-8",
              "User-Agent": "Mozilla/5.0 (GitHub-Actions)"
          }

          resp = requests.post(
              "https://www.autodl.com/api/v1/instance/power_off",
              json={"instance_uuid": INSTANCE_UUID},
              headers=headers, timeout=30
          )
          result = resp.json()
          print(f"关机响应: {json.dumps(result, ensure_ascii=False)}")

          if result.get("code") == "Success":
              print("✅ 关机指令已发送")
          else:
              print(f"⚠️ 关机响应: {result.get('msg', 'unknown')}")
          PYEOF
