# GitHub Actions Workflow - AutoDL 远程采集优惠信息
# 每2小时：开机(国内) → SSH跑脚本 → 关机
# 解决 GitHub 服务器在海外无法调用京东 API 的问题

name: 优惠信息巡检（AutoDL远程）

on:
  schedule:
    # 每2小时运行一次
    - cron: '0 */2 * * *'

  # 支持手动触发（方便测试）
  workflow_dispatch:

jobs:
  collect-via-autodl:
    name: AutoDL远程采集
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      # ========== Step 1: 开机 ==========
      - name: 调用 AutoDL API 开机（无卡模式）
        id: power_on
        run: |
          python3 << 'PYEOF'
          import requests
          import json
          import sys

          SESSION_TOKEN = "${{ secrets.AUTODL_SESSION_TOKEN }}"
          INSTANCE_UUID = "${{ secrets.AUTODL_INSTANCE_UUID }}"

          if not SESSION_TOKEN or not INSTANCE_UUID:
              print("❌ 缺少 AUTODL_SESSION_TOKEN 或 AUTODL_INSTANCE_UUID")
              sys.exit(1)

          headers = {
              "Authorization": SESSION_TOKEN,
              "Content-Type": "application/json;charset=UTF-8",
              "User-Agent": "Mozilla/5.0 (GitHub-Actions)"
          }

          # 开机（无卡模式）
          print("🔌 发送开机指令...")
          resp = requests.post(
              "https://www.autodl.com/api/v1/instance/power_on",
              json={"instance_uuid": INSTANCE_UUID, "payload": "non_gpu"},
              headers=headers, timeout=30
          )
          result = resp.json()
          print(f"开机响应: {json.dumps(result, ensure_ascii=False)}")

          if result.get("code") == "Success":
              print("✅ 开机指令已发送")
          else:
              msg = str(result)
              if "running" in msg.lower() or "已" in msg:
                  print("实例可能已在运行中，继续执行")
              elif "AuthorizeFailed" in msg:
                  print("❌ Session Token 已过期！请运行 update_autodl_token.py 更新")
                  sys.exit(1)
              else:
                  print(f"⚠️ 开机异常: {result.get('msg', 'unknown')}")
                  sys.exit(1)
          PYEOF

      # ========== Step 2: 等待实例启动 ==========
      - name: 等待 AutoDL 实例启动
        run: |
          echo "⏳ 等待实例启动（约90秒）..."
          sleep 90
          echo "✅ 等待完成"

      # ========== Step 3: SSH 执行采集脚本 ==========
      - name: SSH 到 AutoDL 执行采集
        id: ssh_run
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AUTODL_SSH_HOST }}
          port: ${{ secrets.AUTODL_SSH_PORT }}
          username: ${{ secrets.AUTODL_SSH_USER }}
          key: ${{ secrets.AUTODL_SSH_KEY }}
          timeout: 60s
          command_timeout: 300s
          script: |
            echo "===== 开始执行优惠信息采集 ====="
            cd /root

            if [ -d "wool-monitor" ]; then
              cd wool-monitor
              git pull
            else
              git clone https://github.com/duanchaobo/wool-monitor.git
              cd wool-monitor
            fi

            pip install -r requirements.txt -q

            cat > .env << ENVEOF
            WECHAT_WEBHOOK_URL=${{ secrets.WECHAT_WEBHOOK_URL }}
            JD_APP_KEY=${{ secrets.JD_APP_KEY }}
            JD_APP_SECRET=${{ secrets.JD_APP_SECRET }}
            JD_PID=${{ secrets.JD_PID }}
            ENVEOF

            python main.py
            echo "===== 采集执行完毕 ====="

      # ========== Step 4: 无论成功失败，关机 ==========
      - name: 调用 AutoDL API 关机
        if: always()
        run: |
          python3 << 'PYEOF'
          import requests
          import json

          SESSION_TOKEN = "${{ secrets.AUTODL_SESSION_TOKEN }}"
          INSTANCE_UUID = "${{ secrets.AUTODL_INSTANCE_UUID }}"

          headers = {
              "Authorization": SESSION_TOKEN,
              "Content-Type": "application/json;charset=UTF-8",
              "User-Agent": "Mozilla/5.0 (GitHub-Actions)"
          }

          resp = requests.post(
              "https://www.autodl.com/api/v1/instance/power_off",
              json={"instance_uuid": INSTANCE_UUID},
              headers=headers,
              timeout=30
          )
          result = resp.json()
          print(f"关机响应: {json.dumps(result, ensure_ascii=False)}")

          if result.get("code") == "Success":
              print("✅ 关机指令已发送")
          else:
              print(f"⚠️ 关机响应: {result.get('msg', 'unknown')}")
          PYEOF
