# GitHub Actions - Workflow 2: 补充价格 → 折扣过滤 → 生成小程序JSON
# 触发方式：
#   1. Workflow 1 完成后自动触发（全量处理所有商品）
#   2. 手动触发（workflow_dispatch）
name: 补充价格生成JSON（Workflow 2）

on:
  workflow_run:
    workflows: ["采集商品名单（Workflow 1）"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich-and-generate:
    name: 补充价格 → 生成小程序JSON
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      # ========== Step 1: 开机（固定实例，无卡模式，获取最新IP） ==========
      - name: 开机
        id: power_on
        run: |
          python3 << 'PYEOF'
          import os, requests, json, sys, time

          SESSION_TOKEN = "${{ secrets.AUTODL_SESSION_TOKEN }}"
          INSTANCE_UUID = "${{ secrets.AUTODL_INSTANCE_UUID }}"

          headers = {
              "Authorization": SESSION_TOKEN,
              "Content-Type": "application/json;charset=UTF-8",
          }

          def query_instance():
              resp = requests.post(
                  "https://www.autodl.com/api/v1/instance",
                  json={"page_index":1,"page_size":50,"status":[],"charge_type":[],"sub_name":"","unbind_sub_user":False},
                  headers=headers, timeout=30
              )
              result = resp.json()
              if result.get("code") != "Success":
                  return None
              for inst in result.get("data", {}).get("list", []):
                  if inst.get("uuid") == INSTANCE_UUID:
                      return inst
              return None

          target = query_instance()
          if not target:
              print(f"❌ 实例 {INSTANCE_UUID} 不存在")
              sys.exit(1)

          status = target.get("status", "")
          print(f"实例状态: {status}")

          if status != "running":
              print("🔄 开机中（non_gpu 模式）...")
              power_resp = requests.post(
                  "https://www.autodl.com/api/v1/instance/power_on",
                  json={"instance_uuid": INSTANCE_UUID, "payload": "non_gpu"},
                  headers=headers, timeout=30
              )
              power_result = power_resp.json()
              if power_result.get("code") != "Success":
                  print(f"⚠️ 开机失败: {power_result}")
                  sys.exit(1)
              print("✅ 开机指令已发送，等待实例就绪...")

              # 轮询等待实例开机完成，最多等120秒
              for i in range(24):
                  time.sleep(5)
                  target = query_instance()
                  if target and target.get("status") == "running":
                      print(f"✅ 实例已开机（{(i+1)*5}秒）")
                      break
              else:
                  print("❌ 等待开机超时")
                  sys.exit(1)

          # 获取实例IP和SSH端口
          ip = target.get("proxy_host", "")
          ssh_port = target.get("ssh_port", 22)
          print(f"实例: {ip}:{ssh_port}")

          if not ip:
              print("❌ 无法获取实例IP")
              sys.exit(1)

          # 输出给后续步骤使用
          with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
              f.write(f"instance_ip={ip}\n")
              f.write(f"instance_port={ssh_port}\n")
          PYEOF

      - name: 等待启动
        run: sleep 20

      # ========== Step 2: SSH 执行采集 ==========
      - name: SSH 补充价格并生成JSON
        id: ssh_run
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.power_on.outputs.instance_ip }}
          port: ${{ steps.power_on.outputs.instance_port }}
          username: ${{ secrets.AUTODL_SSH_USER }}
          key: ${{ secrets.AUTODL_SSH_KEY }}
          timeout: 2700s
          command_timeout: 2700s
          script: |
            # 保存原始环境（network_turbo会改PATH、代理、路由）
            export ORIG_PATH="$PATH"
            export ORIG_HTTP_PROXY="$http_proxy"
            export ORIG_HTTPS_PROXY="$https_proxy"
            export ORIG_HTTP_PROXY="$HTTP_PROXY"
            export ORIG_HTTPS_PROXY="$HTTPS_PROXY"

            # ===== 函数：开启/关闭学术加速 =====
            enable_turbo() {
              source /etc/network_turbo 2>/dev/null || true
            }
            disable_turbo() {
              export PATH="$ORIG_PATH"
              export http_proxy="$ORIG_HTTP_PROXY"
              export https_proxy="$ORIG_HTTPS_PROXY"
              export HTTP_PROXY="$ORIG_HTTP_PROXY"
              export HTTPS_PROXY="$ORIG_HTTPS_PROXY"
              unset all_proxy ALL_PROXY
            }

            # ===== 阶段1: git clone（开启加速） =====
            rm -rf wool-monitor
            enable_turbo
            for i in 1 2 3 4 5; do
              echo ">>> git clone 尝试第 $i 次..."
              git clone --depth 1 https://github.com/duanchaobo/wool-monitor.git
              if [ -f wool-monitor/requirements.txt ] && [ -f wool-monitor/collect_step2.py ]; then
                echo "✅ git clone 完成"
                break
              fi
              echo "克隆不完整，等待 10 秒后重试..."
              rm -rf wool-monitor
              sleep 10
            done
            cd wool-monitor

            # ===== 阶段2: 检查是否有需要处理的商品 =====
            disable_turbo

            # 确保 python3/pip3 可用
            if ! command -v python3 &>/dev/null; then
              echo ">>> python3 not found, installing..."
              apt-get update -qq && apt-get install -y -qq python3 python3-pip 2>/dev/null
            fi

            # 安装依赖
            pip3 install -r requirements.txt -q --prefer-binary 2>/dev/null || true

            # 配置环境变量
            cat > .env << ENVEOF
            TB_APP_KEY=${{ secrets.TB_APP_KEY }}
            TB_APP_SECRET=${{ secrets.TB_APP_SECRET }}
            TB_ADZONE_ID=${{ secrets.TB_ADZONE_ID }}
            SILICONFLOW_API_KEY=${{ secrets.SILICONFLOW_API_KEY }}
            ENVEOF

            # 检查进度文件，判断是否有待处理商品
            if [ -f docs/enrich_progress.json ]; then
              PROGRESS=$(python3 -c "import json; p=json.load(open('docs/enrich_progress.json')); print(str(p.get('start_index',0))+'|'+str(p.get('total',0))+'|'+str(p.get('completed',False)))")
              START=$(echo $PROGRESS | cut -d'|' -f1)
              TOTAL=$(echo $PROGRESS | cut -d'|' -f2)
              COMPLETED=$(echo $PROGRESS | cut -d'|' -f3)
              echo "进度: start=$START, total=$TOTAL, completed=$COMPLETED"
              if [ "$COMPLETED" = "True" ] || [ "$START" -ge "$TOTAL" ]; then
                echo "✅ 所有商品已处理完毕，跳过本次执行"
                exit 0
              fi
            fi

            # 执行 Workflow 2: 补充价格 → 生成小程序JSON（全量处理）
            # PYTHONUNBUFFERED=1 确保print实时输出到日志（避免缓冲导致日志"卡住"）
            PYTHONUNBUFFERED=1 python3 collect_step2.py --output docs

            # ===== 阶段3: git push（开启加速） =====
            enable_turbo
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add docs/
            git commit -m "更新优惠数据 $(date '+%Y-%m-%d %H:%M')" || echo "无数据变化"
            git push https://${{ secrets.PAT_TOKEN }}@github.com/duanchaobo/wool-monitor.git main || echo "推送失败"

  # ========== 独立的关机 job：无论上游成功/失败/超时都会执行 ==========
  power-off:
    name: 确保关机
    needs: [enrich-and-generate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 关机
        run: |
          python3 << 'PYEOF'
          import requests, json
          SESSION_TOKEN = "${{ secrets.AUTODL_SESSION_TOKEN }}"
          INSTANCE_UUID = "${{ secrets.AUTODL_INSTANCE_UUID }}"
          headers = {"Authorization": SESSION_TOKEN, "Content-Type": "application/json;charset=UTF-8"}
          if not INSTANCE_UUID:
              print("⚠️ 无实例UUID，跳过关机")
              exit(0)
          resp = requests.post(
              "https://www.autodl.com/api/v1/instance/power_off",
              json={"instance_uuid": INSTANCE_UUID},
              headers=headers, timeout=30
          )
          result = resp.json()
          if result.get("code") == "Success":
              print(f"✅ 关机成功: {INSTANCE_UUID[:12]}...")
          else:
              print(f"⚠️ 关机: {result}")
          PYEOF
