# GitHub Actions - 生成小程序用的 JSON 数据
# 定时执行（每天 8:00-22:00 每2小时）或手动触发
# 采集全品类优惠商品，输出为 JSON 文件推送到 GitHub Pages 分支
# ⚠️ 无论任务成功/失败/超时，都会确保关机

name: 生成优惠数据（小程序）

on:
  schedule:
    # 每天北京时间 7:00 执行一次（UTC 23:00）
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-deals-json:
    name: 采集并生成 JSON 数据
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 输出变量传递给下游 job
    outputs:
      need_power_off: ${{ steps.check_status.outputs.need_power_off }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      # ========== Step 1: 查找/开机 GPU 实例 ==========
      - name: 查找并开机 GPU 实例
        id: check_status
        continue-on-error: true
        run: |
          python3 << 'PYEOF'
          import requests, json, os, sys

          SESSION_TOKEN = "${{ secrets.AUTODL_SESSION_TOKEN }}"
          # 主实例UUID（fallback用）
          PRIMARY_UUID = "${{ secrets.AUTODL_INSTANCE_UUID }}"

          need_power_off = "false"
          selected_uuid = ""
          selected_host = ""
          selected_port = ""

          try:
              if not SESSION_TOKEN:
                  print("❌ 缺少 AutoDL 凭证")
                  sys.exit(1)

              headers = {
                  "Authorization": SESSION_TOKEN,
                  "Content-Type": "application/json;charset=UTF-8",
              }

              # 查询所有实例
              resp = requests.post(
                  "https://www.autodl.com/api/v1/instance",
                  json={"page_index":1,"page_size":50,"status":[],"charge_type":[],"sub_name":"","unbind_sub_user":False},
                  headers=headers, timeout=30
              )
              result = resp.json()

              if result.get("code") != "Success":
                  print(f"⚠️ 查询失败: {result}")
                  sys.exit(1)

              instances = result.get("data", {}).get("list", [])
              print(f"共 {len(instances)} 个实例")

              # 提取每个实例的关键信息（SSH直接从API获取）
              def get_ssh_info(inst):
                  """从实例数据提取SSH连接信息"""
                  host = inst.get("proxy_host") or inst.get("ssh_host") or ""
                  port = str(inst.get("ssh_port") or inst.get("proxy_port") or "22")
                  return host, port

              def has_gpu(inst):
                      return inst.get("gpu_all_num", 0) > 0

              # 打印所有实例状态
              for inst in instances:
                  uuid = inst.get("uuid", "")[:12]
                  status = inst.get("status", "")
                  gpu_all = inst.get("gpu_all_num", 0)
                  gpu_idle = inst.get("gpu_idle_num", 0)
                  host, port = get_ssh_info(inst)
                  print(f"  {uuid}... status={status} gpu={gpu_all}/{gpu_idle} ssh={host}:{port}")

              # 策略1: 找已 running 且有 GPU 的实例（直接使用）
              for inst in instances:
                  if inst.get("status") == "running" and has_gpu(inst):
                      uuid = inst.get("uuid")
                      host, port = get_ssh_info(inst)
                      gpu_idle = inst.get("gpu_idle_num", 0)
                      print(f"\n✅ 找到已开机的GPU实例: {uuid[:12]}... GPU空闲={gpu_idle}")
                      selected_uuid = uuid
                      selected_host = host
                      selected_port = port
                      need_power_off = "false"
                      break

              # 策略2: 找 shutdown 且有 GPU 的实例开机
              if not selected_uuid:
                  for inst in instances:
                      if inst.get("status") == "shutdown" and has_gpu(inst):
                          uuid = inst.get("uuid")
                          host, port = get_ssh_info(inst)
                          gpu_all = inst.get("gpu_all_num", 0)
                          print(f"\n🔄 找到关机的GPU实例，准备开机: {uuid[:12]}... GPU={gpu_all}卡")
                          # 开机
                          power_resp = requests.post(
                              "https://www.autodl.com/api/v1/instance/power_on",
                              json={"instance_uuid": uuid, "payload": "gpu"},
                              headers=headers, timeout=30
                          )
                          power_result = power_resp.json()
                          if power_result.get("code") == "Success":
                              print(f"✅ 开机成功: {uuid[:12]}...")
                              selected_uuid = uuid
                              selected_host = host
                              selected_port = port
                              need_power_off = "true"
                              break
                          else:
                              print(f"⚠️ 开机失败 {uuid[:12]}...: {power_result}")

              # 策略3: fallback 到主实例
              if not selected_uuid:
                  for inst in instances:
                      if inst.get("uuid") == PRIMARY_UUID:
                          uuid = inst.get("uuid")
                          host, port = get_ssh_info(inst)
                          print(f"\n⚠️ 无可用GPU实例，使用主实例: {uuid[:12]}... status={inst.get('status')}")
                          selected_uuid = uuid
                          selected_host = host
                          selected_port = port
                          need_power_off = "true"
                          break

              if not selected_uuid:
                  print("❌ 没有任何可用实例")
                  sys.exit(1)

              print(f"\n📌 选中实例: {selected_uuid}")
              print(f"   SSH: {selected_host}:{selected_port}")
              print(f"   need_power_off: {need_power_off}")

          except Exception as e:
              print(f"⚠️ 检查异常: {e}")
              need_power_off = "true"
              selected_uuid = PRIMARY_UUID
              selected_host = "${{ secrets.AUTODL_SSH_HOST }}"
              selected_port = "${{ secrets.AUTODL_SSH_PORT }}"

          finally:
              github_output = os.environ.get("GITHUB_OUTPUT", "")
              if github_output:
                  with open(github_output, "a") as f:
                      f.write(f"need_power_off={need_power_off}\n")
                      f.write(f"selected_uuid={selected_uuid}\n")
                      f.write(f"selected_host={selected_host}\n")
                      f.write(f"selected_port={selected_port}\n")
              print(f"need_power_off={need_power_off}")
              print(f"selected_uuid={selected_uuid}")
              print(f"selected_host={selected_host}")
              print(f"selected_port={selected_port}")
          PYEOF

      - name: 等待启动
        if: steps.check_status.outputs.need_power_off == 'true'
        run: sleep 20

      # ========== Step 3: SSH 执行采集 ==========
      - name: SSH 采集并生成 JSON
        id: ssh_run
        if: steps.check_status.outputs.need_power_off != 'invalid' && steps.check_status.outputs.selected_host != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.check_status.outputs.selected_host }}
          port: ${{ steps.check_status.outputs.selected_port }}
          username: ${{ secrets.AUTODL_SSH_USER }}
          key: ${{ secrets.AUTODL_SSH_KEY }}
          timeout: 900s
          command_timeout: 900s
          script: |
            # 保存原始PATH（network_turbo可能会改PATH）
            export ORIG_PATH="$PATH"
            source /etc/network_turbo 2>/dev/null || true
            export PATH="$ORIG_PATH:$PATH"

            rm -rf wool-monitor
            # git clone 带重试+完整性检查（学术加速不稳定）
            for i in 1 2 3 4 5; do
              echo ">>> git clone 尝试第 $i 次..."
              git clone --depth 1 https://github.com/duanchaobo/wool-monitor.git
              # 检查关键文件是否存在，确保克隆完整
              if [ -f wool-monitor/requirements.txt ] && [ -f wool-monitor/generate_deals_json.py ]; then
                echo "✅ git clone 完成"
                break
              fi
              echo "克隆不完整，等待 10 秒后重试..."
              rm -rf wool-monitor
              sleep 10
            done
            cd wool-monitor

            # 确保 python3 可用
            if ! command -v python3 &>/dev/null; then
              echo ">>> python3 not found, installing..."
              apt-get update -qq && apt-get install -y -qq python3 python3-pip python3-venv 2>/dev/null
            fi

            # 创建虚拟环境并安装依赖
            echo ">>> 创建虚拟环境..."
            python3 -m venv venv
            source venv/bin/activate
            pip install --upgrade pip -q
            pip install -r requirements.txt -q

            # 配置环境变量
            cat > .env << ENVEOF
            TB_APP_KEY=${{ secrets.TB_APP_KEY }}
            TB_APP_SECRET=${{ secrets.TB_APP_SECRET }}
            TB_ADZONE_ID=${{ secrets.TB_ADZONE_ID }}
            SILICONFLOW_API_KEY=${{ secrets.SILICONFLOW_API_KEY }}
            ENVEOF

            # 执行全品类采集，输出 JSON 到 docs/
            source venv/bin/activate
            python generate_deals_json.py --output docs

            # 提交并推送数据到 GitHub
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add docs/
            git commit -m "更新优惠数据 $(date '+%Y-%m-%d %H:%M')" || echo "无数据变化"
            git push https://${{ secrets.PAT_TOKEN }}@github.com/duanchaobo/wool-monitor.git main || echo "推送失败"

  # ========== 独立的关机 job：无论上游成功/失败/超时都会执行 ==========
  power-off:
    name: 确保关机
    needs: [generate-deals-json]
    # 关键：always() 确保无论上游 job 状态如何都会执行
    if: always() && needs.generate-deals-json.outputs.need_power_off == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 关机
        run: |
          python3 << 'PYEOF'
          import requests, json
          SESSION_TOKEN = "${{ secrets.AUTODL_SESSION_TOKEN }}"
          INSTANCE_UUID = "${{ steps.check_status.outputs.selected_uuid }}"
          headers = {"Authorization": SESSION_TOKEN, "Content-Type": "application/json;charset=UTF-8"}
          if not INSTANCE_UUID:
              print("⚠️ 无实例UUID，跳过关机")
              exit(0)
          resp = requests.post(
              "https://www.autodl.com/api/v1/instance/power_off",
              json={"instance_uuid": INSTANCE_UUID},
              headers=headers, timeout=30
          )
          result = resp.json()
          if result.get("code") == "Success":
              print(f"✅ 关机成功: {INSTANCE_UUID[:12]}...")
          else:
              print(f"⚠️ 关机: {result}")
          PYEOF
