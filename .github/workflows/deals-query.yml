# GitHub Actions - 生成小程序用的 JSON 数据
# 定时执行（每天 8:00-22:00 每2小时）或手动触发
# 采集全品类优惠商品，输出为 JSON 文件推送到 GitHub Pages 分支
# ⚠️ 无论任务成功/失败/超时，都会确保关机

name: 生成优惠数据（小程序）

on:
  schedule:
    # 每天北京时间 7:00 执行一次（UTC 23:00）
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-deals-json:
    name: 采集并生成 JSON 数据
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 输出变量传递给下游 job
    outputs:
      need_power_off: ${{ steps.check_status.outputs.need_power_off }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      # ========== Step 1: 查找/开机 GPU 实例 ==========
      - name: 查找并开机 GPU 实例
        id: check_status
        continue-on-error: true
        run: |
          python3 << 'PYEOF'
          import requests, json, os, sys

          SESSION_TOKEN = "${{ secrets.AUTODL_SESSION_TOKEN }}"
          # 候选GPU实例UUID列表（按优先级排列）
          GPU_INSTANCE_UUIDS = [
              "${{ secrets.AUTODL_INSTANCE_UUID }}",  # 主实例
              "${{ secrets.AUTODL_GPU_INSTANCE_1 }}",  # 备用GPU实例1
              "${{ secrets.AUTODL_GPU_INSTANCE_2 }}",  # 备用GPU实例2
          ]
          # 对应的SSH连接信息
          SSH_HOSTS = {
              "${{ secrets.AUTODL_INSTANCE_UUID }}": "${{ secrets.AUTODL_SSH_HOST }}",
              "${{ secrets.AUTODL_GPU_INSTANCE_1 }}": "${{ secrets.AUTODL_GPU_SSH_HOST_1 }}",
              "${{ secrets.AUTODL_GPU_INSTANCE_2 }}": "${{ secrets.AUTODL_GPU_SSH_HOST_2 }}",
          }
          SSH_PORTS = {
              "${{ secrets.AUTODL_INSTANCE_UUID }}": "${{ secrets.AUTODL_SSH_PORT }}",
              "${{ secrets.AUTODL_GPU_INSTANCE_1 }}": "${{ secrets.AUTODL_GPU_SSH_PORT_1 }}",
              "${{ secrets.AUTODL_GPU_INSTANCE_2 }}": "${{ secrets.AUTODL_GPU_SSH_PORT_2 }}",
          }

          need_power_off = "false"
          selected_uuid = ""
          selected_host = ""
          selected_port = ""

          try:
              if not SESSION_TOKEN:
                  print("❌ 缺少 AutoDL 凭证")
                  sys.exit(1)

              headers = {
                  "Authorization": SESSION_TOKEN,
                  "Content-Type": "application/json;charset=UTF-8",
              }

              # 查询所有实例状态
              resp = requests.post(
                  "https://www.autodl.com/api/v1/instance",
                  json={"page_index":1,"page_size":50,"status":[],"charge_type":[],"sub_name":"","unbind_sub_user":False},
                  headers=headers, timeout=30
              )
              result = resp.json()

              if result.get("code") != "Success":
                  print(f"⚠️ 查询失败: {result}")
                  sys.exit(1)

              instances = result.get("data", {}).get("list", [])
              instance_map = {i.get("uuid"): i for i in instances}

              # 调试：打印所有实例的关键字段
              print(f"\n=== 共 {len(instances)} 个实例 ===")
              for inst in instances:
                  uuid = inst.get("uuid", "")[:12]
                  status = inst.get("status", "")
                  ssh_host = inst.get("ssh_host") or inst.get("proxy_host") or inst.get("hostname") or "N/A"
                  ssh_port = inst.get("ssh_port") or inst.get("proxy_port") or "N/A"
                  gpu = inst.get("gpu_info") or inst.get("gpu_name") or inst.get("gpu") or "N/A"
                  print(f"  {uuid}... status={status} ssh={ssh_host}:{ssh_port} gpu={gpu}")
              # 打印第一个实例的完整字段（调试用）
              if instances:
                  print(f"\n=== 第一个实例完整字段 ===")
                  for k, v in sorted(instances[0].items()):
                      print(f"  {k}: {v}")

              # 策略1: 优先找已 running 的 GPU 实例（直接使用，无需开机）
              for uuid in GPU_INSTANCE_UUIDS:
                  if not uuid:
                      continue
                  inst = instance_map.get(uuid)
                  if inst and inst.get("status") == "running":
                      gpu_info = inst.get("gpu_info", "") or inst.get("gpu_name", "") or ""
                      print(f"✅ 找到已开机的GPU实例: {uuid[:12]}... GPU={gpu_info}")
                      selected_uuid = uuid
                      selected_host = SSH_HOSTS.get(uuid, "")
                      selected_port = SSH_PORTS.get(uuid, "22")
                      need_power_off = "false"  # 已在运行，不关机
                      break

              # 策略2: 没有 running 的，找第一个关机的 GPU 实例开机
              if not selected_uuid:
                  for uuid in GPU_INSTANCE_UUIDS:
                      if not uuid:
                          continue
                      inst = instance_map.get(uuid)
                      if inst and inst.get("status") == "stopped":
                          gpu_info = inst.get("gpu_info", "") or inst.get("gpu_name", "") or ""
                          print(f"🔄 找到关机的GPU实例，准备开机: {uuid[:12]}... GPU={gpu_info}")
                          # 开机
                          power_resp = requests.post(
                              "https://www.autodl.com/api/v1/instance/power_on",
                              json={"instance_uuid": uuid, "payload": "gpu"},
                              headers=headers, timeout=30
                          )
                          power_result = power_resp.json()
                          if power_result.get("code") == "Success":
                              print(f"✅ 开机成功: {uuid[:12]}...")
                              selected_uuid = uuid
                              selected_host = SSH_HOSTS.get(uuid, "")
                              selected_port = SSH_PORTS.get(uuid, "22")
                              need_power_off = "true"  # 我们开的，需要关机
                              break
                          else:
                              print(f"⚠️ 开机失败 {uuid[:12]}...: {power_result}，尝试下一个")

              # 策略3: 都没有，使用主实例（无论状态）
              if not selected_uuid:
                  primary = GPU_INSTANCE_UUIDS[0]
                  if primary and primary in instance_map:
                      inst = instance_map[primary]
                      print(f"⚠️ 无可用GPU实例，使用主实例: {primary[:12]}... status={inst.get('status')}")
                      selected_uuid = primary
                      selected_host = SSH_HOSTS.get(primary, "")
                      selected_port = SSH_PORTS.get(primary, "22")
                      need_power_off = "true"

              if not selected_uuid:
                  print("❌ 没有任何可用实例")
                  sys.exit(1)

              print(f"\n📌 选中实例: {selected_uuid}")
              print(f"   SSH: {selected_host}:{selected_port}")
              print(f"   need_power_off: {need_power_off}")

          except Exception as e:
              print(f"⚠️ 检查异常: {e}")
              need_power_off = "true"
              selected_uuid = GPU_INSTANCE_UUIDS[0] if GPU_INSTANCE_UUIDS else ""
              selected_host = SSH_HOSTS.get(selected_uuid, "${{ secrets.AUTODL_SSH_HOST }}")
              selected_port = SSH_PORTS.get(selected_uuid, "${{ secrets.AUTODL_SSH_PORT }}")

          finally:
              github_output = os.environ.get("GITHUB_OUTPUT", "")
              if github_output:
                  with open(github_output, "a") as f:
                      f.write(f"need_power_off={need_power_off}\n")
                      f.write(f"selected_uuid={selected_uuid}\n")
                      f.write(f"selected_host={selected_host}\n")
                      f.write(f"selected_port={selected_port}\n")
              print(f"need_power_off={need_power_off}")
              print(f"selected_uuid={selected_uuid}")
              print(f"selected_host={selected_host}")
              print(f"selected_port={selected_port}")
          PYEOF

      - name: 等待启动
        if: steps.check_status.outputs.need_power_off == 'true'
        run: sleep 20

      # ========== Step 3: SSH 执行采集 ==========
      - name: SSH 采集并生成 JSON
        id: ssh_run
        if: steps.check_status.outputs.need_power_off != 'invalid' && steps.check_status.outputs.selected_host != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.check_status.outputs.selected_host }}
          port: ${{ steps.check_status.outputs.selected_port }}
          username: ${{ secrets.AUTODL_SSH_USER }}
          key: ${{ secrets.AUTODL_SSH_KEY }}
          timeout: 900s
          command_timeout: 900s
          script: |
            source /etc/network_turbo 2>/dev/null || true
            rm -rf wool-monitor
            # git clone 带重试+完整性检查（学术加速不稳定）
            for i in 1 2 3 4 5; do
              echo ">>> git clone 尝试第 $i 次..."
              git clone --depth 1 https://github.com/duanchaobo/wool-monitor.git
              # 检查关键文件是否存在，确保克隆完整
              if [ -f wool-monitor/requirements.txt ] && [ -f wool-monitor/generate_deals_json.py ]; then
                echo "✅ git clone 完成"
                break
              fi
              echo "克隆不完整，等待 10 秒后重试..."
              rm -rf wool-monitor
              sleep 10
            done
            cd wool-monitor

            # 安装中文字体
            apt-get update -qq && apt-get install -y -qq fonts-wqy-zenhei 2>/dev/null || true

            # 安装依赖
            pip3 install -r requirements.txt -q

            # 配置环境变量
            cat > .env << ENVEOF
            TB_APP_KEY=${{ secrets.TB_APP_KEY }}
            TB_APP_SECRET=${{ secrets.TB_APP_SECRET }}
            TB_ADZONE_ID=${{ secrets.TB_ADZONE_ID }}
            SILICONFLOW_API_KEY=${{ secrets.SILICONFLOW_API_KEY }}
            ENVEOF

            # 执行全品类采集，输出 JSON 到 docs/
            python3 generate_deals_json.py --output docs

            # 提交并推送数据到 GitHub
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add docs/
            git commit -m "更新优惠数据 $(date '+%Y-%m-%d %H:%M')" || echo "无数据变化"
            git push https://${{ secrets.PAT_TOKEN }}@github.com/duanchaobo/wool-monitor.git main || echo "推送失败"

  # ========== 独立的关机 job：无论上游成功/失败/超时都会执行 ==========
  power-off:
    name: 确保关机
    needs: [generate-deals-json]
    # 关键：always() 确保无论上游 job 状态如何都会执行
    if: always() && needs.generate-deals-json.outputs.need_power_off == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 关机
        run: |
          python3 << 'PYEOF'
          import requests, json
          SESSION_TOKEN = "${{ secrets.AUTODL_SESSION_TOKEN }}"
          INSTANCE_UUID = "${{ steps.check_status.outputs.selected_uuid }}"
          headers = {"Authorization": SESSION_TOKEN, "Content-Type": "application/json;charset=UTF-8"}
          if not INSTANCE_UUID:
              print("⚠️ 无实例UUID，跳过关机")
              exit(0)
          resp = requests.post(
              "https://www.autodl.com/api/v1/instance/power_off",
              json={"instance_uuid": INSTANCE_UUID},
              headers=headers, timeout=30
          )
          result = resp.json()
          if result.get("code") == "Success":
              print(f"✅ 关机成功: {INSTANCE_UUID[:12]}...")
          else:
              print(f"⚠️ 关机: {result}")
          PYEOF
