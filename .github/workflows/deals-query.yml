# GitHub Actions - 生成小程序用的 JSON 数据
# 定时执行（每天 7:00 北京时间）或手动触发
# 采集天猫旗舰店优惠商品，输出为 JSON 文件推送到 GitHub Pages 分支
# ⚠️ 无论任务成功/失败/超时，都会确保关机
name: 生成优惠数据（小程序）

on:
  schedule:
    # 每天北京时间 7:00 执行一次（UTC 23:00）
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-deals-json:
    name: 采集并生成 JSON 数据
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      # ========== Step 1: 开机（固定实例，无卡模式） ==========
      - name: 开机
        id: power_on
        run: |
          python3 << 'PYEOF'
          import requests, json, sys

          SESSION_TOKEN = "${{ secrets.AUTODL_SESSION_TOKEN }}"
          INSTANCE_UUID = "${{ secrets.AUTODL_INSTANCE_UUID }}"

          headers = {
              "Authorization": SESSION_TOKEN,
              "Content-Type": "application/json;charset=UTF-8",
          }

          # 查询实例状态
          resp = requests.post(
              "https://www.autodl.com/api/v1/instance",
              json={"page_index":1,"page_size":50,"status":[],"charge_type":[],"sub_name":"","unbind_sub_user":False},
              headers=headers, timeout=30
          )
          result = resp.json()

          if result.get("code") != "Success":
              print(f"❌ 查询失败: {result}")
              sys.exit(1)

          instances = result.get("data", {}).get("list", [])
          target = None
          for inst in instances:
              if inst.get("uuid") == INSTANCE_UUID:
                  target = inst
                  break

          if not target:
              print(f"❌ 实例 {INSTANCE_UUID} 不存在")
              sys.exit(1)

          status = target.get("status", "")
          print(f"实例状态: {status}")

          if status == "running":
              print("✅ 实例已开机，无需操作")
          else:
              print("🔄 开机中（non_gpu 模式）...")
              power_resp = requests.post(
                  "https://www.autodl.com/api/v1/instance/power_on",
                  json={"instance_uuid": INSTANCE_UUID, "payload": "non_gpu"},
                  headers=headers, timeout=30
              )
              power_result = power_resp.json()
              if power_result.get("code") == "Success":
                  print("✅ 开机成功")
              else:
                  print(f"⚠️ 开机: {power_result}")
          PYEOF

      - name: 等待启动
        run: sleep 20

      # ========== Step 2: SSH 执行采集 ==========
      - name: SSH 采集并生成 JSON
        id: ssh_run
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AUTODL_SSH_HOST }}
          port: ${{ secrets.AUTODL_SSH_PORT }}
          username: ${{ secrets.AUTODL_SSH_USER }}
          key: ${{ secrets.AUTODL_SSH_KEY }}
          timeout: 900s
          command_timeout: 900s
          script: |
            # 保存原始环境（network_turbo会改PATH和网络路由）
            export ORIG_PATH="$PATH"

            rm -rf wool-monitor
            # 仅 git clone 时使用学术加速（加速GitHub访问）
            source /etc/network_turbo 2>/dev/null || true
            for i in 1 2 3 4 5; do
              echo ">>> git clone 尝试第 $i 次..."
              git clone --depth 1 https://github.com/duanchaobo/wool-monitor.git
              if [ -f wool-monitor/requirements.txt ] && [ -f wool-monitor/generate_deals_json.py ]; then
                echo "✅ git clone 完成"
                break
              fi
              echo "克隆不完整，等待 10 秒后重试..."
              rm -rf wool-monitor
              sleep 10
            done
            # 恢复原始环境（避免network_turbo影响SSH稳定性和pip/API调用）
            export PATH="$ORIG_PATH"
            unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY all_proxy ALL_PROXY
            cd wool-monitor

            # 确保 python3/pip3 可用
            if ! command -v python3 &>/dev/null; then
              echo ">>> python3 not found, installing..."
              apt-get update -qq && apt-get install -y -qq python3 python3-pip 2>/dev/null
            fi

            # 安装依赖（系统Python，忽略已安装的包）
            pip3 install -r requirements.txt -q --prefer-binary 2>/dev/null || true

            # === 诊断：测试 optional.upgrade API 在 AutoDL 上是否可用 ===
            echo "=== API 诊断测试 ==="
            python3 << 'TESTEOF'
import os, sys, json, hashlib, requests
from datetime import datetime

env_file = os.path.join(os.path.dirname(os.path.abspath('.')), 'wool-monitor', '.env')
if not os.path.exists(env_file):
    env_file = '.env'
with open(env_file) as f:
    for line in f:
        line = line.strip()
        if line and not line.startswith('#') and '=' in line:
            k, _, v = line.partition('=')
            if v: os.environ[k.strip()] = v

TB_APP_KEY = os.environ.get('TB_APP_KEY', '')
TB_APP_SECRET = os.environ.get('TB_APP_SECRET', '')
TB_ADZONE_ID = os.environ.get('TB_ADZONE_ID', '')

def _make_sign(params, secret):
    sorted_params = sorted(params.items(), key=lambda x: str(x[0]))
    sign_str = secret
    for k, v in sorted_params:
        sign_str += str(k) + str(v)
    sign_str += secret
    return hashlib.md5(sign_str.encode('utf-8')).hexdigest().upper()

API_GATEWAY = 'https://eco.taobao.com/router/rest'

# 测试 recommend
print('测试 recommend API...')
timestamp = datetime.now().strftime('%Y-%m-%d %H:%M:%S')
params = {'app_key': TB_APP_KEY, 'method': 'taobao.tbk.dg.material.recommend', 'timestamp': timestamp, 'v': '2.0', 'sign_method': 'md5', 'format': 'json', 'adzone_id': int(TB_ADZONE_ID), 'material_id': 13371, 'page_no': 1, 'page_size': 2}
params['sign'] = _make_sign(params, TB_APP_SECRET)
resp = requests.get(API_GATEWAY, params=params, timeout=15)
result = resp.json()
if 'error_response' in result:
    print(f'  recommend: ❌ {result["error_response"]}')
else:
    items = result.get('tbk_dg_material_recommend_response', {}).get('result_list', {}).get('map_data', [])
    print(f'  recommend: ✅ 返回 {len(items)} 条')

# 测试 optional.upgrade（连续3次）
print('测试 optional.upgrade API（连续3次）...')
for i in range(3):
    timestamp = datetime.now().strftime('%Y-%m-%d %H:%M:%S')
    params = {'app_key': TB_APP_KEY, 'method': 'taobao.tbk.dg.material.optional.upgrade', 'timestamp': timestamp, 'v': '2.0', 'sign_method': 'md5', 'format': 'json', 'adzone_id': int(TB_ADZONE_ID), 'q': f'面膜{i}', 'page_no': 1, 'page_size': 2, 'platform': 2}
    params['sign'] = _make_sign(params, TB_APP_SECRET)
    resp = requests.get(API_GATEWAY, params=params, timeout=15)
    result = resp.json()
    if 'error_response' in result:
        err = result['error_response']
        print(f'  第{i+1}次: ❌ code={err.get("code")}, msg={err.get("msg")}')
    else:
        items = result.get('tbk_dg_material_optional_upgrade_response', {}).get('result_list', {}).get('map_data', [])
        print(f'  第{i+1}次: ✅ 返回 {len(items)} 条')
print('=== 诊断结束 ===')
TESTEOF

            # 配置环境变量
            cat > .env << ENVEOF
            TB_APP_KEY=${{ secrets.TB_APP_KEY }}
            TB_APP_SECRET=${{ secrets.TB_APP_SECRET }}
            TB_ADZONE_ID=${{ secrets.TB_ADZONE_ID }}
            SILICONFLOW_API_KEY=${{ secrets.SILICONFLOW_API_KEY }}
            ENVEOF

            # 执行全品类采集，输出 JSON 到 docs/
            python3 generate_deals_json.py --output docs

            # 提交并推送数据到 GitHub
            source /etc/network_turbo 2>/dev/null || true
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add docs/
            git commit -m "更新优惠数据 $(date '+%Y-%m-%d %H:%M')" || echo "无数据变化"
            git push https://${{ secrets.PAT_TOKEN }}@github.com/duanchaobo/wool-monitor.git main || echo "推送失败"

  # ========== 独立的关机 job：无论上游成功/失败/超时都会执行 ==========
  power-off:
    name: 确保关机
    needs: [generate-deals-json]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 关机
        run: |
          python3 << 'PYEOF'
          import requests, json
          SESSION_TOKEN = "${{ secrets.AUTODL_SESSION_TOKEN }}"
          INSTANCE_UUID = "${{ secrets.AUTODL_INSTANCE_UUID }}"
          headers = {"Authorization": SESSION_TOKEN, "Content-Type": "application/json;charset=UTF-8"}
          if not INSTANCE_UUID:
              print("⚠️ 无实例UUID，跳过关机")
              exit(0)
          resp = requests.post(
              "https://www.autodl.com/api/v1/instance/power_off",
              json={"instance_uuid": INSTANCE_UUID},
              headers=headers, timeout=30
          )
          result = resp.json()
          if result.get("code") == "Success":
              print(f"✅ 关机成功: {INSTANCE_UUID[:12]}...")
          else:
              print(f"⚠️ 关机: {result}")
          PYEOF
