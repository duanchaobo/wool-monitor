# GitHub Actions - 小程序搜索触发
# 接收用户搜索词，采集相关商品，生成搜索结果 JSON

name: 搜索优惠商品（小程序）

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: '搜索关键词'
        required: true
        type: string

permissions:
  contents: write

jobs:
  search-deals:
    name: 搜索 ${{ github.event.inputs.keyword }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      # ========== Step 1: 检查实例状态 ==========
      - name: 检查 AutoDL 实例状态
        id: check_status
        run: |
          python3 << 'PYEOF'
          import requests, json, os, sys

          SESSION_TOKEN = "${{ secrets.AUTODL_SESSION_TOKEN }}"
          INSTANCE_UUID = "${{ secrets.AUTODL_INSTANCE_UUID }}"

          if not SESSION_TOKEN or not INSTANCE_UUID:
              sys.exit(1)

          headers = {
              "Authorization": SESSION_TOKEN,
              "Content-Type": "application/json;charset=UTF-8",
          }

          resp = requests.post(
              "https://www.autodl.com/api/v1/instance",
              json={"page_index":1,"page_size":50,"status":[],"charge_type":[],"sub_name":"","unbind_sub_user":False},
              headers=headers, timeout=30
          )
          result = resp.json()

          if result.get("code") != "Success":
              sys.exit(1)

          instances = result.get("data", {}).get("list", [])
          target = next((i for i in instances if i.get("uuid") == INSTANCE_UUID), None)

          if not target:
              sys.exit(1)

          status = target.get("status", "")
          need_power_off = "false" if status == "running" else "true"
          github_output = os.environ.get("GITHUB_OUTPUT", "")
          if github_output:
              with open(github_output, "a") as f:
                  f.write(f"need_power_off={need_power_off}\n")
          PYEOF

      # ========== Step 2: 开机 ==========
      - name: 开机
        if: steps.check_status.outputs.need_power_off == 'true'
        run: |
          python3 << 'PYEOF'
          import requests, json
          SESSION_TOKEN = "${{ secrets.AUTODL_SESSION_TOKEN }}"
          INSTANCE_UUID = "${{ secrets.AUTODL_INSTANCE_UUID }}"
          headers = {"Authorization": SESSION_TOKEN, "Content-Type": "application/json;charset=UTF-8"}
          resp = requests.post(
              "https://www.autodl.com/api/v1/instance/power_on",
              json={"instance_uuid": INSTANCE_UUID, "payload": "non_gpu"},
              headers=headers, timeout=30
          )
          result = resp.json()
          if result.get("code") == "Success":
              print("✅ 开机成功")
          PYEOF

      - name: 等待启动
        if: steps.check_status.outputs.need_power_off == 'true'
        run: sleep 20

      # ========== Step 3: SSH 执行搜索 ==========
      - name: SSH 搜索商品
        id: ssh_run
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AUTODL_SSH_HOST }}
          port: ${{ secrets.AUTODL_SSH_PORT }}
          username: ${{ secrets.AUTODL_SSH_USER }}
          key: ${{ secrets.AUTODL_SSH_KEY }}
          timeout: 60s
          command_timeout: 300s
          script: |
            source /etc/network_turbo 2>/dev/null || true
            rm -rf wool-monitor
            git clone https://github.com/duanchaobo/wool-monitor.git
            cd wool-monitor

            apt-get update -qq && apt-get install -y -qq fonts-wqy-zenhei 2>/dev/null || true
            pip3 install -r requirements.txt -q

            cat > .env << ENVEOF
            WECHAT_WEBHOOK_URL=${{ secrets.WECHAT_WEBHOOK_URL }}
            JD_APP_KEY=${{ secrets.JD_APP_KEY }}
            JD_APP_SECRET=${{ secrets.JD_APP_SECRET }}
            JD_PID=${{ secrets.JD_PID }}
            TB_APP_KEY=${{ secrets.TB_APP_KEY }}
            TB_APP_SECRET=${{ secrets.TB_APP_SECRET }}
            TB_ADZONE_ID=${{ secrets.TB_ADZONE_ID }}
            SILICONFLOW_API_KEY=${{ secrets.SILICONFLOW_API_KEY }}
            ENVEOF

            # 执行搜索，生成结果 JSON
            python3 generate_deals_json.py --search "${{ github.event.inputs.keyword }}" --output deals-data

            # 提交并推送
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add deals-data/
            git commit -m "搜索结果: ${{ github.event.inputs.keyword }} $(date '+%Y-%m-%d %H:%M')" || echo "无数据变化"
            git push https://${{ secrets.GITHUB_TOKEN }}@github.com/duanchaobo/wool-monitor.git main || echo "推送失败"

      # ========== Step 4: 关机 ==========
      - name: 关机
        if: steps.check_status.outputs.need_power_off == 'true'
        run: |
          python3 << 'PYEOF'
          import requests, json
          SESSION_TOKEN = "${{ secrets.AUTODL_SESSION_TOKEN }}"
          INSTANCE_UUID = "${{ secrets.AUTODL_INSTANCE_UUID }}"
          headers = {"Authorization": SESSION_TOKEN, "Content-Type": "application/json;charset=UTF-8"}
          resp = requests.post(
              "https://www.autodl.com/api/v1/instance/power_off",
              json={"instance_uuid": INSTANCE_UUID},
              headers=headers, timeout=30
          )
          result = resp.json()
          if result.get("code") == "Success":
              print("✅ 关机成功")
          PYEOF
